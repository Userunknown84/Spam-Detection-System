name: Backend CI Pipeline

on:
  push:
    branches: [ "main" ]
    paths:
      - 'backend/**'
  pull_request:
    branches: [ "main", "master","feature" ]
    paths:
      - 'backend/**'

jobs:
  test:
    name: Run Jest Unit Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # 18.x is EOL and no longer satisfies the eslint 10.x devDependency's
        # engines requirement (^20.19.0 || ^22.13.0 || >=24) introduced by
        # this PR; test against the versions we actually support instead.
        node-version: [20.x, 22.x, 24.x]

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: ./backend/package-lock.json

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Execute Test Suite
        run: npm test
